[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "app.api.dependency.dependencies.require_roles",
]

[tool.ruff.lint.per-file-ignores]
"app/models/ErrorCategory.py" = ["UP042"]
"app/models/user.py" = ["UP042"]
"app/schemas/error_ticketSchema.py" = ["UP042"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
